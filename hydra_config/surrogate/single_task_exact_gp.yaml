_target_: evomobo.models.single_task_gp.SingleTaskExactGP

training_seed: 0

max_shift: 0
mask_size: 0

bootstrap_ratio: null
min_num_train: 1
task_noise_init: 0.15

gp_lr: 1e-3
enc_lr: 1e-3
pretrain_lr: 1e-5
encoder_wd: 5e-5

bs: ${encoder.batch_size}
num_epochs: 256
holdout_ratio: 0.2
patience: 50
eval_period: 1

feature_dim: 32

covar_module:
  _target_: gpytorch.kernels.MaternKernel
  ard_num_dims: ${surrogate.feature_dim}
  lengthscale_prior:
    _target_: gpytorch.priors.NormalPrior
    loc: 0.7
    scale: 0.3

likelihood:
  _target_: gpytorch.likelihoods.GaussianLikelihood
  noise_constraint:
    _target_: gpytorch.constraints.GreaterThan
    lower_bound: 1e-4
