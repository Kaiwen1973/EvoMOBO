_target_: evomobo.models.lm_elements.LanguageModel
name: mcnn

model:
  _target_: evomobo.models.mcnn_encoder.mCNN
  tokenizer: ${tokenizer}
  max_len: ${task.max_len}     
  embed_dim: 64
  latent_dim: 16
  out_dim: 32
  kernel_size: 5
  p: 0.0
  layernorm: True
  max_len_delta: 0

batch_size: 64
num_epochs: 128
patience: 32
lr: 1e-3
max_shift: 0
mask_ratio: 0.125
