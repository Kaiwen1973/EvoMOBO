_target_: evomobo.models.lm_elements.LanguageModel
name: onehot

model:
  _target_: evomobo.models.onehot_encoder.OneHotEncoderLmHeadForLambo
  tokenizer: ${tokenizer}
  max_len: ${task.max_len}
  out_dim: 32
  kernel_size: 5
  p: 0.0
  layernorm: true
  logit_scale: 5.0

batch_size: 128
num_epochs: 128
patience: 32
lr: 1e-3
max_shift: 0
mask_ratio: 0.125
