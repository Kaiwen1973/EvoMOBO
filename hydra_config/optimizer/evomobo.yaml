_target_: evomobo.optimizers.evomobo.EvoMOBO
_recursive_: False

num_rounds: 1
num_gens: 64
num_opt_steps: 16
patience: 32
lr: 0.1
concentrate_pool: 1
mask_ratio: 0.125
resampling_weight: 1.0

encoder_obj: mlm

optimize_latent: True
position_sampler:  uniform
entropy_penalty: 1e-2
latent_trust_radius: 1.0
window_size: 1
latent_init: null
mutable_positions: "25,26,28,29"
positions_index_base: 1

obj_weights: null

offline_mode: True
offline_selection_mode: "greedy_mean_hvi"  # rank1_batch_only | ranked_batch | greedy_mean_hvi
offline_num_suggestions: 16
offline_suggest_csv: "to_eval.csv"
offline_exam_template_csv: "exam_template.csv"
offline_backfill_from_ranked_batches: True

use_pool_csv_points: True
use_pareto_extra_csv_points: True

ckpt_dir: null
ckpt_name: "evomobo"
resume: True
save_ckpt_every_round: True
resume_allow_unsafe: False

print_splits: True
print_splits_max_rows: 0
